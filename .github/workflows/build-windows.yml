name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app (release + NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "src-tauri/target/release/procurement-client.exe" "artifact/ProcurementListTool.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "artifact/" -ErrorAction SilentlyContinue
          Get-ChildItem artifact | Format-Table Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProcurementListTool-windows-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
