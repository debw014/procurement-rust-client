    // ===== Real .xlsx export: minimal OOXML package built locally (no library, no CDN) =====
    // Quantity / price / amount are stored as NUMBERS (amount column gets a SUM formula on the
    // total row), so the file can be re-calculated in Excel/WPS instead of being dead text.
    function escapeXml(val) {
      if (val === null || val === undefined) return "";
      return String(val)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const CRC_TABLE = (() => {
      const table = new Int32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        table[n] = c;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = -1;
      for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xff];
      return (crc ^ -1) >>> 0;
    }

    // ZIP with stored (uncompressed) entries
    function buildZip(files) {
      const enc = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;
      const u16 = (v) => [v & 0xff, (v >>> 8) & 0xff];
      const u32 = (v) => [v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff];
      for (const f of files) {
        const nameBytes = enc.encode(f.name);
        const data = enc.encode(f.content);
        const crc = crc32(data);
        const local = new Uint8Array([
          ...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0),
          ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length),
          ...u16(nameBytes.length), ...u16(0)
        ]);
        chunks.push(local, nameBytes, data);
        central.push({ nameBytes, crc, size: data.length, offset });
        offset += local.length + nameBytes.length + data.length;
      }
      const centralStart = offset;
      for (const c of central) {
        const rec = new Uint8Array([
          ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0),
          ...u16(0), ...u16(0x21), ...u32(c.crc), ...u32(c.size), ...u32(c.size),
          ...u16(c.nameBytes.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
          ...u32(0), ...u32(c.offset)
        ]);
        chunks.push(rec, c.nameBytes);
        offset += rec.length + c.nameBytes.length;
      }
      const end = new Uint8Array([
        ...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(central.length), ...u16(central.length),
        ...u32(offset - centralStart), ...u32(centralStart), ...u16(0)
      ]);
      chunks.push(end);
      const total = chunks.reduce((a, c) => a + c.length, 0);
      const out = new Uint8Array(total);
      let pos = 0;
      for (const c of chunks) { out.set(c, pos); pos += c.length; }
      return out;
    }

    function buildXlsxBytes() {
      // Full paper format, page by page: title row + header row + exactly 17 body rows
      // (data rows + total row + blank rows), all bordered — same layout as the printed sheet.
      const { pages, showHandler } = getPageModel();
      const total = calcTotalAmount(state.rows);
      const colCount = showHandler ? 6 : 5;
      const lastCol = showHandler ? "F" : "E";
      const colLetter = (i) => String.fromCharCode(65 + i);
      const strCell = (ref, val, style) => `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${escapeXml(val)}</t></is></c>`;
      const numCell = (ref, val, style) => `<c r="${ref}" s="${style}"><v>${val}</v></c>`;
      const emptyCell = (ref, style) => `<c r="${ref}" s="${style}"/>`;
      const isNum = (v) => v !== "" && v !== null && v !== undefined && !isNaN(parseFloat(v));

      let sheetRows = "";
      const merges = [];
      const amountRanges = [];
      let rn = 0;
      const emitRow = (cellsHtml, ht) => {
        sheetRows += `<row r="${rn}" ht="${ht}" customHeight="1">${cellsHtml}</row>`;
      };

      pages.forEach((page) => {
        // title row
        rn++;
        merges.push(`A${rn}:${lastCol}${rn}`);
        let titleCells = strCell(`A${rn}`, `单位名称：${state.orgName || ""}`, 3);
        for (let c = 1; c < colCount; c++) titleCells += emptyCell(`${colLetter(c)}${rn}`, 3);
        emitRow(titleCells, 30);
        // header row
        rn++;
        const headers = showHandler
          ? ["日期", "内容", "数量", "单价", "金额", "经手人"]
          : ["日期", "内容", "数量", "单价", "金额"];
        emitRow(headers.map((h, i) => strCell(`${colLetter(i)}${rn}`, h, 4)).join(""), 28);
        // data rows
        const bodyStart = rn + 1;
        page.items.forEach(({ row: r, qtyDisplay }) => {
          rn++;
          let cells = "";
          cells += r.date ? strCell(`A${rn}`, r.date, 1) : emptyCell(`A${rn}`, 1);
          cells += r.content ? strCell(`B${rn}`, r.content, 1) : emptyCell(`B${rn}`, 1);
          cells += qtyDisplay ? strCell(`C${rn}`, qtyDisplay, 1) : emptyCell(`C${rn}`, 1);
          cells += isNum(r.price) ? numCell(`D${rn}`, parseFloat(r.price), 2) : emptyCell(`D${rn}`, 2);
          cells += isNum(r.qty) && isNum(r.price) ? numCell(`E${rn}`, calcRowAmount(r), 2) : emptyCell(`E${rn}`, 2);
          if (showHandler) cells += r.handler ? strCell(`F${rn}`, r.handler, 1) : emptyCell(`F${rn}`, 1);
          emitRow(cells, 24);
        });
        if (page.items.length > 0) amountRanges.push([bodyStart, rn]);
        // total row (SUM spans the amount cells of every page)
        if (page.hasTotal) {
          rn++;
          let totalCells = emptyCell(`A${rn}`, 1) + strCell(`B${rn}`, "合    计", 5);
          totalCells += emptyCell(`C${rn}`, 1) + emptyCell(`D${rn}`, 2);
          if (amountRanges.length > 0) {
            const formula = amountRanges.map(([a, b]) => (a === b ? `E${a}` : `E${a}:E${b}`)).join(",");
            totalCells += `<c r="E${rn}" s="2"><f>SUM(${formula})</f><v>${total}</v></c>`;
          } else {
            totalCells += emptyCell(`E${rn}`, 2);
          }
          if (showHandler) totalCells += emptyCell(`F${rn}`, 1);
          emitRow(totalCells, 24);
        }
        // blank rows fill the page to the full 17 body rows, borders included
        for (let b = 0; b < page.blankCount; b++) {
          rn++;
          let blank = "";
          for (let c = 0; c < colCount; c++) blank += emptyCell(`${colLetter(c)}${rn}`, c === 3 || c === 4 ? 2 : 1);
          emitRow(blank, 24);
        }
      });

      const widths = showHandler ? [12, 62, 12, 10, 12, 14] : [12, 70, 12, 10, 12];
      const cols = widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("");
      const mergeXml = merges.map((m) => `<mergeCell ref="${m}"/>`).join("");

      const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${cols}</cols><sheetData>${sheetRows}</sheetData><mergeCells count="${merges.length}">${mergeXml}</mergeCells></worksheet>`;

      const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="0"/><fonts count="3"><font><sz val="12"/><name val="SimSun"/></font><font><sz val="14"/><name val="SimSun"/></font><font><b/><sz val="12"/><name val="SimSun"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="2"><border><left/><right/><top/><bottom/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs></styleSheet>`;

      const files = [
        { name: "[Content_Types].xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
        { name: "_rels/.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
        { name: "xl/workbook.xml", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="清单" sheetId="1" r:id="rId1"/></sheets></workbook>` },
        { name: "xl/_rels/workbook.xml.rels", content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
        { name: "xl/worksheets/sheet1.xml", content: sheetXml },
        { name: "xl/styles.xml", content: stylesXml }
      ];
      return buildZip(files);
    }

    function exportToExcel() {
      const bytes = buildXlsxBytes();
      const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${getExportBaseName()}.xlsx`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("已导出 Excel (.xlsx)：完整单据格式（含每页空白行与合计），金额为数值带 SUM 公式");
    }

    ["inDate", "inContent", "inQty", "inUnit", "inPrice", "inHandler"].forEach((id) => {
      document.getElementById(id).addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addRowFromInput();
        }
      });
    });

    /* ===== 本地文件自动同步（File System Access API + IndexedDB 句柄持久化） ===== */
    let localFileHandle = null;
    let localFileNeedsPermission = false;
    let localSyncTimer = null;
    const FS_DB_NAME = "procurement_tool_fs_v1";
    const FS_STORE_NAME = "handles";

    function openFsDb() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === "undefined") return reject(new Error("no indexedDB"));
        const req = indexedDB.open(FS_DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(FS_STORE_NAME)) {
            req.result.createObjectStore(FS_STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFileHandleToDb(handle) {
      try {
        const db = await openFsDb();
        const tx = db.transaction(FS_STORE_NAME, "readwrite");
        tx.objectStore(FS_STORE_NAME).put(handle, "archiveFile");
      } catch {}
    }

    async function loadFileHandleFromDb() {
      try {
        const db = await openFsDb();
        return await new Promise((resolve) => {
          const tx = db.transaction(FS_STORE_NAME, "readonly");
          const req = tx.objectStore(FS_STORE_NAME).get("archiveFile");
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch {
        return null;
      }
    }

    function updateLocalFileStatusUI(syncedTime = null) {
      const el = document.getElementById("localFileStatusText");
      const btn = document.getElementById("localFileStatusBtn");
      if (!el || !btn) return;
      if (localFileHandle) {
        if (localFileNeedsPermission) {
          el.textContent = `🔄 点击恢复本地同步（${localFileHandle.name}）`;
          btn.style.borderColor = "#f59e0b";
          btn.style.background = "#fffbeb";
          btn.style.color = "#b45309";
        } else {
          const suffix = syncedTime ? ` · ${syncedTime}` : "";
          el.textContent = `📁 已同步本地：${localFileHandle.name}${suffix}`;
          btn.style.borderColor = "#10b981";
          btn.style.background = "#ecfdf5";
          btn.style.color = "#047857";
        }
      } else {
        el.textContent = "📁 本地文件：未绑定（点击绑定防清缓存）";
        btn.style.borderColor = "";
        btn.style.background = "";
        btn.style.color = "";
      }
    }

    async function writeBackupToBoundFile() {
      if (!localFileHandle || localFileNeedsPermission) return false;
      try {
        const perm = await localFileHandle.queryPermission({ mode: "readwrite" });
        if (perm !== "granted") {
          localFileNeedsPermission = true;
          updateLocalFileStatusUI();
          return false;
        }
        const writable = await localFileHandle.createWritable();
        await writable.write(JSON.stringify(collectBackupData(), null, 2));
        await writable.close();
        updateLocalFileStatusUI(nowString().slice(11));
        return true;
      } catch {
        localFileNeedsPermission = true;
        updateLocalFileStatusUI();
        return false;
      }
    }

    function scheduleLocalFileSync(immediate = false) {
      if (!localFileHandle || localFileNeedsPermission) return;
      clearTimeout(localSyncTimer);
      if (immediate) {
        writeBackupToBoundFile();
      } else {
        localSyncTimer = setTimeout(() => writeBackupToBoundFile(), 450);
      }
    }

    async function handleLocalFileStatusClick() {
      if (localFileHandle && localFileNeedsPermission) {
        try {
          const perm = await localFileHandle.requestPermission({ mode: "readwrite" });
          if (perm === "granted") {
            localFileNeedsPermission = false;
            await writeBackupToBoundFile();
            showToast(`已恢复自动同步至：${localFileHandle.name}`);
            return;
          }
        } catch {}
      }
      await bindLocalArchiveFile();
    }

    async function bindLocalArchiveFile() {
      if (typeof window.showSaveFilePicker !== "function") {
        exportBackup();
        showToast("当前浏览器不支持直接绑定文件，已为你下载 .json 本地存档文件");
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: "采购清单本地存档库.json",
          types: [{ description: "JSON 存档文件", accept: { "application/json": [".json"] } }]
        });
        localFileHandle = handle;
        localFileNeedsPermission = false;
        await saveFileHandleToDb(handle);
        const ok = await writeBackupToBoundFile();
        if (ok) {
          showToast(`已绑定本地文件「${handle.name}」，后续修改与存档将自动写入硬盘`);
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
        exportBackup();
        showToast("无法直接绑定本地文件，已改为下载 .json 存档文件");
      }
    }

    async function restoreLocalFileHandleOnBoot() {
      const savedHandle = await loadFileHandleFromDb();
      if (!savedHandle) {
        updateLocalFileStatusUI();
        return;
      }
      localFileHandle = savedHandle;
      try {
        const perm = await savedHandle.queryPermission({ mode: "readwrite" });
        localFileNeedsPermission = perm !== "granted";
      } catch {
        localFileNeedsPermission = true;
      }
      updateLocalFileStatusUI();
    }

    init();
    restoreLocalFileHandleOnBoot();

    /* ===== Rust (Tauri 2) 桌面端原生落盘桥接 ===== */
    (function setupTauriBridge() {
      const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
      if (!invoke) return;

      let tauriSyncTimer = null;
      const syncToRustDisk = async () => {
        try {
          const path = await invoke("save_app_data", { payload: JSON.stringify(collectBackupData(), null, 2) });
          const textEl = document.getElementById("localFileStatusText");
          const btnEl = document.getElementById("localFileStatusBtn");
          if (textEl && btnEl) {
            textEl.textContent = "💾 桌面本地库已自动落盘 · " + nowString().slice(11);
            btnEl.title = "本地存储路径：" + path;
            btnEl.style.borderColor = "#10b981";
            btnEl.style.background = "#ecfdf5";
            btnEl.style.color = "#047857";
          }
        } catch (err) {
          console.error("Rust 本地写入失败:", err);
        }
      };

      const origSaveCurrent = window.saveCurrentState;
      window.saveCurrentState = function (...args) {
        origSaveCurrent.apply(this, args);
        clearTimeout(tauriSyncTimer);
        tauriSyncTimer = setTimeout(syncToRustDisk, 250);
      };

      const origSetArchives = window.setArchives;
      window.setArchives = function (...args) {
        origSetArchives.apply(this, args);
        syncToRustDisk();
      };

      const origSetSnapshots = window.setSnapshots;
      window.setSnapshots = function (...args) {
        origSetSnapshots.apply(this, args);
        clearTimeout(tauriSyncTimer);
        tauriSyncTimer = setTimeout(syncToRustDisk, 250);
      };

      // 启动时从 Rust 磁盘存档恢复数据（即使 localStorage 被清空也能无损加载）
      invoke("load_app_data").then(async (raw) => {
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (parsed.current) localStorage.setItem(STORAGE_KEYS.CURRENT, JSON.stringify(parsed.current));
            if (Array.isArray(parsed.archives)) localStorage.setItem(STORAGE_KEYS.ARCHIVES, JSON.stringify(parsed.archives));
            if (Array.isArray(parsed.snapshots)) localStorage.setItem(STORAGE_KEYS.SNAPSHOTS, JSON.stringify(parsed.snapshots));
            init();
          } catch {}
        } else {
          await syncToRustDisk();
        }
        try {
          const path = await invoke("get_data_file_path");
          const textEl = document.getElementById("localFileStatusText");
          const btnEl = document.getElementById("localFileStatusBtn");
          if (textEl && btnEl) {
            textEl.textContent = "💾 桌面本地库：已自动落盘（防清理）";
            btnEl.title = "本地存储路径：" + path;
            btnEl.style.borderColor = "#10b981";
            btnEl.style.background = "#ecfdf5";
            btnEl.style.color = "#047857";
          }
        } catch {}
      }).catch(() => {});
    })();
  </script>

  <!-- 自定义标题栏交互：最小化 / 最大化 / 关闭（拖拽与双击最大化由 Tauri 的 data-tauri-drag-region 原生处理） -->
  <script>
    (function setupCustomTitlebar() {
      const tauri = window.__TAURI__;
      if (!tauri || !tauri.window) return;

      const appWindow = tauri.window.getCurrentWindow();
      document.body.classList.add("is-tauri");

      const minBtn = document.getElementById("tbMin");
      const maxBtn = document.getElementById("tbMax");
      const closeBtn = document.getElementById("tbClose");
      if (!minBtn || !maxBtn || !closeBtn) return;

      const ICON_MAX = '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.6" y="0.6" width="8.8" height="8.8" fill="none" stroke="currentColor" stroke-width="1.1" /></svg>';
      const ICON_RESTORE = '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.6" y="2.9" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.1" /><path d="M2.9 2.9V0.6h6.5v6.5H7.1" fill="none" stroke="currentColor" stroke-width="1.1" /></svg>';

      const syncMaxState = async () => {
        try {
          const maximized = await appWindow.isMaximized();
          maxBtn.innerHTML = maximized ? ICON_RESTORE : ICON_MAX;
          maxBtn.title = maximized ? "向下还原" : "最大化";
          maxBtn.setAttribute("aria-label", maxBtn.title);
        } catch (err) {
          /* 忽略：非桌面端或权限不足 */
        }
      };

      minBtn.addEventListener("click", () => appWindow.minimize());
      maxBtn.addEventListener("click", async () => {
        try {
          await appWindow.toggleMaximize();
        } finally {
          syncMaxState();
        }
      });
      closeBtn.addEventListener("click", () => appWindow.close());

      if (appWindow.onResized) appWindow.onResized(() => syncMaxState());
      window.addEventListener("resize", syncMaxState);
      syncMaxState();
    })();
  </script>
</body>
